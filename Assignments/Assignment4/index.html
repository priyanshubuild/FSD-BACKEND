<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Help Desk</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Campus Help Desk</h1>
            <p>Submit and track campus-related problems and requests</p>
        </header>

        <!-- Submit / Edit Request Form -->
        <div class="card form-card">
            <h2 id="form-title">Submit a New Request</h2>
            <form id="requestForm">
                <input type="hidden" id="requestId">

                <div class="form-row">
                    <div class="form-group">
                        <label for="studentName">Student Name</label>
                        <input type="text" id="studentName" placeholder="e.g. Priyanshu Gupta" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="e.g. student@campus.edu" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="category">Category</label>
                        <select id="category" required>
                            <option value="" disabled selected>Select Category</option>
                            <option value="Hostel Facilities">Hostel Facilities</option>
                            <option value="Wi-Fi & Network">Wi-Fi & Network</option>
                            <option value="Academics">Academics</option>
                            <option value="Library">Library</option>
                            <option value="Maintenance">Maintenance</option>
                            <option value="Mess & Canteen">Mess & Canteen</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="priority">Priority</label>
                        <select id="priority" required>
                            <option value="" disabled selected>Select Priority</option>
                            <option value="Low">Low</option>
                            <option value="Medium">Medium</option>
                            <option value="High">High</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="description">Problem Description</label>
                    <textarea id="description" rows="3" placeholder="Describe your problem or request in detail..." required></textarea>
                </div>

                <div class="button-group">
                    <button type="submit" id="submitBtn" class="btn btn-primary">Submit Request</button>
                    <button type="button" id="cancelBtn" class="btn btn-secondary" style="display: none;">Cancel Edit</button>
                </div>
            </form>
        </div>

        <!-- Requests List Section -->
        <div class="card list-card">
            <div class="list-header">
                <h2>Submitted Requests</h2>
                <span id="requestCount" class="badge-count">0 Requests</span>
            </div>

            <div id="requestsList" class="requests-container">
                <!-- Dynamically populated by index.js -->
            </div>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
